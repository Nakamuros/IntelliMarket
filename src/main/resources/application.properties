spring.application.name=intellimarket-api

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/mydatabase
spring.datasource.username=myuser
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

#Spring Security & JWT
intellimarket.security.jwt.secret=UnaClaveSuperSecretaYMuyLargaDeIntelliMarketQueNadieDebeSaber123!
intellimarket.security.jwt.expiration-ms=900000
intellimarket.security.jwt.refresh-expiration-ms=604800000

# Server Configuration
server.port=8080

# Docker Compose Configuration
spring.docker.compose.enabled=false

springdoc.override-with-generic-response=false